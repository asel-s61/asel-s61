name: Refresh profile telemetry
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: profile-telemetry
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate telemetry
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Commit updated image
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/telemetry.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public GitHub telemetry'
            git push
          fi
