<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="680" viewBox="0 0 1440 680" role="img" aria-labelledby="title desc">
<title id="title">ASEL 61 / Midnight Club</title><desc id="desc">Bordeaux and midnight blue motorsport poster featuring a custom widebody Mustang-inspired race car with a tall rear wing and animated exhaust flames, oversized lettering, racing number 61 and track graphics.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#172a49"/><stop offset="1" stop-color="#070d19"/></linearGradient>
<linearGradient id="red" x2=".7" y2="1"><stop stop-color="#c36683"/><stop offset=".35" stop-color="#8b2d50"/><stop offset="1" stop-color="#3b1028"/></linearGradient>
<linearGradient id="body" x2=".3" y2="1"><stop stop-color="#b74e73"/><stop offset=".35" stop-color="#70213f"/><stop offset=".7" stop-color="#47152d"/><stop offset="1" stop-color="#190e20"/></linearGradient>
<linearGradient id="glass" x2="1" y2="1"><stop stop-color="#597794"/><stop offset=".5" stop-color="#172b45"/><stop offset="1" stop-color="#090e1b"/></linearGradient>
<radialGradient id="wheel"><stop stop-color="#24344b"/><stop offset=".65" stop-color="#0b1020"/><stop offset=".7" stop-color="#b0b6c4"/><stop offset=".76" stop-color="#333b4d"/><stop offset=".8" stop-color="#090b13"/><stop offset="1" stop-color="#04070e"/></radialGradient>
<pattern id="grid" width="55" height="55" patternUnits="userSpaceOnUse"><path d="M55 0H0V55" fill="none" stroke="#b1c4df" stroke-opacity=".055"/></pattern>
<pattern id="check" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M0 0h12v12H0zM12 12h12v12H12z" fill="#d3c7d0"/></pattern>
<clipPath id="frame"><rect width="1440" height="680" rx="20"/></clipPath>
<linearGradient id="hood" x2=".5" y2="1"><stop stop-color="#be6684"/><stop offset=".45" stop-color="#81344f"/><stop offset="1" stop-color="#4c1d34"/></linearGradient>
<linearGradient id="flame" x1="0" x2="1"><stop stop-color="#b2e8ff"/><stop offset=".16" stop-color="#6daeff"/><stop offset=".36" stop-color="#fff0a9"/><stop offset=".65" stop-color="#ff9b37"/><stop offset="1" stop-color="#ee4a22" stop-opacity="0"/></linearGradient>
<radialGradient id="firelight"><stop stop-color="#fa7e45" stop-opacity=".5"/><stop offset="1" stop-color="#fa7e45" stop-opacity="0"/></radialGradient>
<pattern id="carbon" width="10" height="10" patternUnits="userSpaceOnUse"><path d="M0 0h5v5H0zM5 5h5v5H5z" fill="#334056"/><path d="M5 0h5v5H5zM0 5h5v5H0z" fill="#121b2c"/></pattern>
</defs><style>
@keyframes backfire{0%,34%,64%,100%{opacity:0;transform:scaleX(.08) scaleY(.35)}39%{opacity:1;transform:scaleX(1) scaleY(1)}43%{opacity:.8;transform:scaleX(.65) scaleY(.7)}48%{opacity:1;transform:scaleX(.95) scaleY(.9)}54%{opacity:0;transform:scaleX(.2) scaleY(.4)}69%{opacity:.9;transform:scaleX(.75) scaleY(.8)}76%{opacity:0;transform:scaleX(.1) scaleY(.2)}}
@keyframes flicker{0%,100%{transform:scaleY(.8)}50%{transform:scaleY(1.15)}}
.flames{animation:backfire 4.8s ease-in-out infinite;transform-origin:1253px 502px}.flame-tip{animation:flicker .18s ease-in-out infinite;transform-origin:1253px 502px}
@keyframes rush{from{transform:translateX(240px)}to{transform:translateX(-1000px)}}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes wheel{to{transform:rotate(360deg)}}
@keyframes dash{to{stroke-dashoffset:-600}}
@keyframes glow{50%{opacity:.35}}
.speed{animation:rush 1.5s linear infinite}.speed.s2{animation-delay:-.7s;animation-duration:1.9s}.speed.s3{animation-delay:-1.1s;animation-duration:1.2s}
.car{animation:idle .65s ease-in-out infinite}.rim{animation:wheel .5s linear infinite;transform-box:fill-box;transform-origin:center}
.circuit{animation:dash 8s linear infinite}.running{animation:glow 2s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.speed,.car,.rim,.circuit,.running,.flames,.flame-tip{animation:none}.flames{opacity:0}}
</style>
<g clip-path="url(#frame)">
