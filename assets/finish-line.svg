<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="100" viewBox="0 0 1280 100" role="img" aria-labelledby="title">
  <title id="title">Built with curiosity. Driven by progress. Asel / 61.</title>
  <rect width="1280" height="100" rx="12" fill="#0d1117"/>
  <path d="M0 0h7v100H0z" fill="#c8ff00"/>
  <text x="34" y="45" fill="#f5f7f8" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="3">BUILT WITH CURIOSITY. DRIVEN BY PROGRESS.</text>
  <text x="35" y="72" fill="#8793a0" font-family="Consolas,monospace" font-size="12" letter-spacing="2">EVERY COMMIT IS ANOTHER LAP.</text>
  <text x="1080" y="61" fill="#c8ff00" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="900" font-style="italic">ASEL / 61</text>
