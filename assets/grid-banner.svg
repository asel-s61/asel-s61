<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="440" viewBox="0 0 1440 440" role="img" aria-labelledby="title desc">
<title id="title">Asel — student, developer, motorsport enthusiast.</title>
<desc id="desc">Minimal midnight blue composition with oversized ivory Asel lettering, a Bordeaux racing stripe and subtle outlined number 61.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2=".7"><stop stop-color="#111c30"/><stop offset="1" stop-color="#0b111d"/></linearGradient>
 <linearGradient id="stripe" x2="1" y2="1"><stop stop-color="#87334d"/><stop offset="1" stop-color="#521d32"/></linearGradient>
 <clipPath id="clip"><rect width="1440" height="440" rx="16"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1440" height="440" fill="url(#bg)"/>
 <path d="M1130-60h175L970 500H795z" fill="url(#stripe)"/>
 <path d="M1327-60h2L994 500h-2z" fill="#bd899b" opacity=".6"/>
 <text x="1035" y="333" fill="none" stroke="#8390a7" stroke-opacity=".23" stroke-width="1.5" font-family="Arial,Helvetica,sans-serif" font-size="270" font-weight="700" font-style="italic" letter-spacing="-24">61</text>
 <text x="66" y="61" fill="#b9a3af" font-family="Consolas,monospace" font-size="12" letter-spacing="3">ASEL-S61</text>
 <text x="1373" y="61" text-anchor="end" fill="#7f8ba0" font-family="Consolas,monospace" font-size="12" letter-spacing="3">PERSONAL SPACE / 061</text>
 <text x="56" y="286" fill="#efede9" font-family="Arial,Helvetica,sans-serif" font-size="205" font-weight="700" letter-spacing="-13">asel<tspan fill="#b66b83">.</tspan></text>
 <text x="69" y="342" fill="#a3adbd" font-family="Arial,Helvetica,sans-serif" font-size="21" letter-spacing="1">A little code. A little motorsport. A lot of curiosity.</text>
