<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">ASEL / 61 — Midnight Motorsport</title>
<desc id="desc">Midnight navy and Bordeaux racing livery, silver typography, circuit linework and a large outlined driver number 61.</desc>
<defs>
