 <text x="88" y="419" fill="#8693a7" font-family="Consolas,monospace" font-size="11" letter-spacing="2">LEARNING BY BUILDING</text>
 <text x="1372" y="419" text-anchor="end" fill="#8693a7" font-family="Consolas,monospace" font-size="11" letter-spacing="2">DHBW / STUDENT</text>
